<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ SWORD DUEL ONLINE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;color:#eee;font-family:'Share Tech Mono',monospace;overflow:hidden;user-select:none;}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#0d0d1a;}
#lobby{text-align:center;background:rgba(15,20,50,0.97);border:1px solid #1a3060;border-radius:16px;padding:2.5rem 2rem;width:360px;box-shadow:0 0 60px rgba(78,204,163,0.08);}
h1{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:#4ecca3;letter-spacing:4px;margin-bottom:.2rem;text-shadow:0 0 20px rgba(78,204,163,.5);}
.sub{color:#445;font-size:.75rem;letter-spacing:3px;margin-bottom:1.8rem;}
.sep{border:none;border-top:1px solid #1a3060;margin:1.1rem 0;}
.btn{background:transparent;border:1px solid currentColor;padding:11px 0;border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:.95rem;width:100%;transition:all .18s;display:block;margin:6px 0;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-g{color:#4ecca3;}.btn-g:hover:not(:disabled){background:#4ecca3;color:#0d0d1a;}
.btn-r{color:#e94560;}.btn-r:hover:not(:disabled){background:#e94560;color:#fff;}
input{background:rgba(15,50,80,.6);border:1px solid #4ecca3;color:#fff;padding:11px 14px;border-radius:8px;font-family:'Share Tech Mono',monospace;font-size:1.3rem;width:100%;margin:6px 0;outline:none;text-transform:uppercase;letter-spacing:8px;text-align:center;}
input::placeholder{color:#334;letter-spacing:1px;text-transform:none;font-size:.82rem;}
#status{font-size:.8rem;margin-top:10px;min-height:40px;line-height:1.7;}
.code-box{font-family:'Orbitron',sans-serif;font-size:2.4rem;color:#4ecca3;letter-spacing:12px;background:rgba(78,204,163,.07);border:1px dashed #4ecca355;border-radius:10px;padding:14px;margin:10px 0;display:none;cursor:pointer;}
.code-box:hover{background:rgba(78,204,163,.15);}
.code-hint{color:#445;font-size:.7rem;margin-top:2px;}
.badge{display:inline-block;background:#4ecca322;border:1px solid #4ecca344;color:#4ecca3;font-size:.65rem;padding:2px 10px;border-radius:20px;letter-spacing:2px;margin-bottom:1rem;}

/* 게임 */
#gameContainer{display:none;position:fixed;inset:0;}
canvas{display:block;}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:10px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.phud{background:rgba(5,8,20,.9);border:1px solid;border-radius:10px;padding:9px 12px;min-width:160px;backdrop-filter:blur(6px);}
.pm{border-color:#4ecca355;}.po{border-color:#e9456055;}
.hud-name{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:2px;margin-bottom:5px;}
.hud-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:.7rem;color:#667;}
.hud-bar{flex:1;height:5px;background:#111;border-radius:3px;overflow:hidden;}
.hud-fill{height:100%;border-radius:3px;transition:width .2s;}
.skill-icons{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap;}
.skill-tag{font-size:.6rem;padding:1px 5px;border-radius:4px;border:1px solid;opacity:.85;}

/* 스킬 선택 오버레이 */
#skillOverlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:16px;}
#skillOverlay h2{font-family:'Orbitron',sans-serif;font-size:1.4rem;color:#f0c040;letter-spacing:3px;text-align:center;}
#skillOverlay .sub2{color:#556;font-size:.75rem;margin-top:-8px;}
.skill-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.skill-card{background:rgba(10,15,40,.98);border:2px solid #1a3060;border-radius:14px;padding:1.4rem 1.2rem;width:160px;cursor:pointer;transition:all .2s;text-align:center;}
.skill-card:hover{transform:translateY(-6px);box-shadow:0 0 30px currentColor;}
.skill-card .s-icon{font-size:2.2rem;margin-bottom:.5rem;}
.skill-card .s-name{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;margin-bottom:.4rem;}
.skill-card .s-desc{font-size:.68rem;color:#889;line-height:1.5;}

/* 게임오버 */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:200;}
#ovBox{text-align:center;background:rgba(10,15,40,.99);border:1px solid #1a3060;border-radius:16px;padding:2.5rem 2rem;width:300px;}
#ovBox h2{font-family:'Orbitron',sans-serif;font-size:1.8rem;margin-bottom:.5rem;}
#ovBox p{color:#667;margin-bottom:1.5rem;}
#minimap{position:fixed;bottom:14px;right:14px;opacity:.75;border-radius:4px;}
#ctrl{position:fixed;bottom:14px;left:14px;font-size:.62rem;color:#334;line-height:2;pointer-events:none;}
</style>
</head>
<body>
<div id="ui">
  <div id="lobby">
    <div class="badge">🌐 ONLINE MULTIPLAYER</div>
    <h1>⚔ SWORD DUEL</h1>
    <div class="sub">경험치 · 검 성장 · 스킬 · 1 VS 1</div>
    <hr class="sep">
    <button class="btn btn-g" id="hBtn" onclick="hostRoom()">🏠 방 만들기</button>
    <div class="code-box" id="codeBox" onclick="copyCode()"></div>
    <div class="code-hint" id="codeHint"></div>
    <hr class="sep">
    <input id="codeIn" maxlength="6" placeholder="방 코드 입력" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
    <button class="btn btn-r" id="jBtn" onclick="joinRoom()">🚪 참가하기</button>
    <div id="status"></div>
  </div>
</div>

<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="phud pm">
      <div class="hud-name" style="color:#4ecca3">나 ▶</div>
      <div class="hud-row">HP <span id="h1hp">100</span><div class="hud-bar"><div class="hud-fill" id="h1hpf" style="width:100%;background:#4ecca3"></div></div></div>
      <div class="hud-row">XP <span id="h1xp">0</span><div class="hud-bar"><div class="hud-fill" id="h1xpf" style="width:0%;background:#f0c040"></div></div></div>
      <div class="hud-row" style="color:#4ecca3aa">검 <span id="h1sw">60</span>px</div>
      <div class="skill-icons" id="h1skills"></div>
    </div>
    <div style="font-size:.65rem;color:#334;text-align:center;padding-top:4px;">🌐 Supabase</div>
    <div class="phud po" style="text-align:right">
      <div class="hud-name" style="color:#e94560">◀ 상대</div>
      <div class="hud-row">HP <span id="h2hp">100</span><div class="hud-bar"><div class="hud-fill" id="h2hpf" style="width:100%;background:#e94560"></div></div></div>
      <div class="hud-row">XP <span id="h2xp">0</span><div class="hud-bar"><div class="hud-fill" id="h2xpf" style="width:0%;background:#f0c040"></div></div></div>
      <div class="hud-row" style="color:#e9456088;justify-content:flex-end">검 <span id="h2sw">60</span>px</div>
      <div class="skill-icons" id="h2skills" style="justify-content:flex-end"></div>
    </div>
  </div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="ctrl">WASD / 방향키: 이동 | 마우스: 조준 | 좌클릭: 검 휘두르기 | E: 대쉬</div>

  <!-- 스킬 선택 -->
  <div id="skillOverlay">
    <h2>⚡ 스킬 선택</h2>
    <div class="sub2">하나를 골라 영구 적용됩니다</div>
    <div class="skill-cards" id="skillCards"></div>
  </div>

  <!-- 게임오버 -->
  <div id="overlay">
    <div id="ovBox">
      <h2 id="ovT"></h2><p id="ovM"></p>
      <button class="btn btn-g" onclick="backToLobby()">로비로 돌아가기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ── Supabase ──
const SUPA_URL='https://dbhyycsjnqwowdwzhqgk.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaHl5Y3NqbnF3b3dkd3pocWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTM0ODgsImV4cCI6MjA5NjM4OTQ4OH0.oqeI0DlceqW9bsSL7u1RMQ8jZyYlEZQoSOTS6QGYFeU';
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

// ── 상수 (모두 시간 기반 — 프레임레이트 무관) ──
const MAP_W=2400,MAP_H=2400,TILE=80;
const BASE_SPEED=220;          // px/초
const SWING_DUR_MS=350;        // 스윙 지속 ms
const SWING_ARC=Math.PI*1.15;
const BASE_DMG=22;
const MAX_SWORD=240,SWORD_BASE=60,XP_PER_SWORD=30,SWORD_GROW=20;
const SKILL_THRESHOLDS=[70,180,330];
const DASH_DIST=160,DASH_CD_MS=2000; // 대쉬 쿨다운 ms
const REGEN_INTERVAL_MS=1000;         // 재생 간격 ms

// ── 스킬 정의 ──
const SKILL_DEFS={
  blade:{ name:'검기 발사', icon:'⚡', desc:'공격 시 검기가 날아가 추가 피해', color:'#f0c040' },
  armor:{ name:'철갑',     icon:'🛡', desc:'받는 피해 35% 감소',              color:'#4ecca3' },
  regen:{ name:'재생',     icon:'💚', desc:'초당 2HP 자동 회복',             color:'#4ecca3' },
  dash: { name:'대쉬',     icon:'💨', desc:'E키로 빠른 대쉬 (쿨다운 2초)',   color:'#e94560' },
  speed:{ name:'이동속도', icon:'🏃', desc:'이동속도 35% 증가',              color:'#f0c040' },
};

// ── 전역 상태 ──
let ch=null,myRole=null,roomCode='',gameRunning=false,gameOver=false;
let me={},op={},orbs=[],projectiles=[];
let particles=[],cam={x:0,y:0};
let swingCDms=0,clicking=false,dashCDms=0;
const keys={},prevKeys={};
let mx=0,my=0,lastPosSent=0,frameCount=0;
let opBuf=[];
let choosingSkill=false;
let lastFrameTime=0; // 델타타임용

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const mm=document.getElementById('minimap'),mctx=mm.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// ── UI ──
function st(msg,c='#4ecca3'){const e=document.getElementById('status');e.style.color=c;e.innerHTML=msg;}
function setBtns(d){document.getElementById('hBtn').disabled=d;document.getElementById('jBtn').disabled=d;}
function copyCode(){
  navigator.clipboard.writeText(roomCode).catch(()=>{});
  document.getElementById('codeHint').textContent='✅ 복사됨!';
  setTimeout(()=>document.getElementById('codeHint').textContent='클릭하면 복사',1500);
}
function randCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

// ── Supabase 채널 ──
function send(type,payload){
  if(!ch)return;
  ch.send({type:'broadcast',event:'g',payload:{t:type,p:payload,r:myRole}});
}
function setupChannel(code,onReady){
  if(ch){sb.removeChannel(ch);ch=null;}
  ch=sb.channel('sd_'+code,{config:{broadcast:{self:false}}});
  ch.on('broadcast',{event:'g'},({payload:m})=>{if(m&&m.r!==myRole)handleMsg(m);});
  ch.subscribe(s=>{
    if(s==='SUBSCRIBED')onReady&&onReady();
    else if(s==='CHANNEL_ERROR'){st('❌ 서버 오류. 새로고침해주세요.','#e94560');setBtns(false);}
  });
}

// ── 로비 ──
function hostRoom(){
  setBtns(true);roomCode=randCode();myRole='host';st('서버 연결 중...');
  setupChannel(roomCode,()=>{
    const b=document.getElementById('codeBox');
    b.style.display='block';b.textContent=roomCode;
    document.getElementById('codeHint').textContent='클릭하면 복사';
    st('✅ 준비됨! 친구에게 <b style="color:#4ecca3;letter-spacing:4px">'+roomCode+'</b> 코드를 보내주세요.');
  });
}
function joinRoom(){
  const code=document.getElementById('codeIn').value.trim().toUpperCase();
  if(code.length!==6){st('6자리 코드를 입력하세요','#e94560');return;}
  roomCode=code;myRole='guest';setBtns(true);st('서버 연결 중...');
  setupChannel(code,()=>{
    st('✅ 연결됨! 참가 신호 전송 중...');send('join',{});
    setTimeout(()=>{if(!gameRunning){st('⚠️ 응답 없음. 호스트가 먼저 방을 만들어야 합니다.','#e94560');setBtns(false);}},12000);
  });
}

// ── 플레이어 생성 ──
function mkPlayer(x,y,color){
  return{
    x,y,hp:100,maxHp:100,totalXp:0,swordLen:SWORD_BASE,
    swordAngle:0,swinging:false,swingElapsed:0,swingStart:0,
    dead:false,color,hitThisSwing:false,prevX:x,prevY:y,
    speed:BASE_SPEED,dmgReduction:0,hasRegen:false,hasDash:false,hasBlade:false,
    regenTimer:0,skills:[],nextSkillIdx:0
  };
}
function mkOrbs(n=30){
  const arr=[];
  for(let i=0;i<n;i++)arr.push({
    x:150+Math.random()*(MAP_W-300),y:150+Math.random()*(MAP_H-300),
    r:8,value:8+Math.floor(Math.random()*18),alive:true,pulse:Math.random()*Math.PI*2,id:i
  });
  return arr;
}

// ── 스킬 시스템 ──
function getSkillChoices(player){
  const all=Object.keys(SKILL_DEFS);
  const owned=player.skills;
  const available=all.filter(k=>!owned.includes(k));
  if(available.length===0)return[];
  // 3개 랜덤 선택
  const shuffled=available.sort(()=>Math.random()-.5);
  return shuffled.slice(0,Math.min(3,shuffled.length));
}

function showSkillChoice(){
  if(choosingSkill||gameOver)return;
  choosingSkill=true;
  const choices=getSkillChoices(me);
  if(choices.length===0){choosingSkill=false;return;}
  const container=document.getElementById('skillCards');
  container.innerHTML='';
  choices.forEach(key=>{
    const def=SKILL_DEFS[key];
    const card=document.createElement('div');
    card.className='skill-card';
    card.style.color=def.color;
    card.style.borderColor=def.color+'88';
    card.innerHTML=`<div class="s-icon">${def.icon}</div><div class="s-name">${def.name}</div><div class="s-desc">${def.desc}</div>`;
    card.onclick=()=>selectSkill(key);
    container.appendChild(card);
  });
  document.getElementById('skillOverlay').style.display='flex';
}

function selectSkill(key){
  document.getElementById('skillOverlay').style.display='none';
  choosingSkill=false;
  applySkill(me,key);
  me.skills.push(key);
  me.nextSkillIdx++;
  send('skill',{key});
  updateSkillHUD();
}

function applySkill(player,key){
  if(key==='armor')player.dmgReduction+=0.35;
  if(key==='regen')player.hasRegen=true;
  if(key==='dash')player.hasDash=true;
  if(key==='blade')player.hasBlade=true;
  if(key==='speed')player.speed+=BASE_SPEED*0.35;
}

function updateSkillHUD(){
  ['h1skills','h2skills'].forEach((id,idx)=>{
    const p=idx===0?me:op;
    const el=document.getElementById(id);
    el.innerHTML='';
    (p.skills||[]).forEach(k=>{
      const d=SKILL_DEFS[k];
      const tag=document.createElement('span');
      tag.className='skill-tag';
      tag.style.color=d.color;tag.style.borderColor=d.color+'66';
      tag.textContent=d.icon+' '+d.name;
      el.appendChild(tag);
    });
  });
}

// ── 메시지 처리 ──
function handleMsg(m){
  const{t,p}=m;
  if(t==='join'&&myRole==='host'){
    orbs=mkOrbs(30);
    me=mkPlayer(200,200,'#4ecca3');
    op=mkPlayer(MAP_W-200,MAP_H-200,'#e94560');
    opBuf=[];projectiles=[];
    send('start',{orbs:orbs.map(o=>({x:Math.round(o.x),y:Math.round(o.y),r:o.r,v:o.value,id:o.id}))});
    startGame();
  }
  if(t==='start'&&myRole==='guest'){
    orbs=p.orbs.map(o=>({x:o.x,y:o.y,r:o.r,value:o.v,alive:true,pulse:Math.random()*Math.PI*2,id:o.id}));
    me=mkPlayer(MAP_W-200,MAP_H-200,'#e94560');
    op=mkPlayer(200,200,'#4ecca3');
    opBuf=[];projectiles=[];
    startGame();
  }
  if(t==='pos'){
    // 판정용: 최신 실제 위치 즉시 적용
    op.x=p.x; op.y=p.y;
    op.swordLen=p.sl; op.totalXp=p.xp;
    op.realSa=p.sa; op.realSw=p.sw; op.realSs=p.ss;
    // 렌더링용: 보간 버퍼에 추가
    opBuf.push({ts:Date.now(),x:p.x,y:p.y,sa:p.sa,sw:p.sw,ss:p.ss});
    if(opBuf.length>12)opBuf.shift();
  }
  if(t==='orb'){
    const o=orbs.find(o=>o.id===p.id);
    if(o)o.alive=false;
    if(p.no&&!orbs.find(o=>o.id===p.no.id))
      orbs.push({x:p.no.x,y:p.no.y,r:8,value:p.no.v,alive:true,pulse:Math.random()*Math.PI*2,id:p.no.id});
  }
  if(t==='hit'){
    const dmg=p.d*(1-Math.min(0.7,me.dmgReduction));
    me.hp=Math.max(0,me.hp-dmg);
    spawnP(me.x,me.y,'#e94560',12);
    if(me.hp<=0&&!me.dead){me.dead=true;send('dead',{});endGame(false);}
  }
  if(t==='blade_hit'){
    const dmg=p.d*(1-Math.min(0.7,me.dmgReduction));
    me.hp=Math.max(0,me.hp-dmg);
    spawnP(me.x,me.y,'#f0c040',8);
    if(me.hp<=0&&!me.dead){me.dead=true;send('dead',{});endGame(false);}
  }
  if(t==='dead'){op.dead=true;endGame(true);} // 상대가 죽었다 = 내가 승리
  if(t==='skill'){
    op.skills=op.skills||[];
    op.skills.push(p.key);
    applySkill(op,p.key);
    updateSkillHUD();
  }
  if(t==='proj'){
    projectiles.push({x:p.x,y:p.y,vx:p.vx,vy:p.vy,color:op.color||'#e94560',life:1.2,maxLife:1.2,fromOp:true,id:p.id});
  }
  // 상대 HP 동기화 (pos 메시지로 받은 실제 HP 반영)
  if(t==='pos'&&p.hp!==undefined) op.hp=p.hp;
}

// ── 입력 ──
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!prevKeys[k]&&k==='e')tryDash();
  keys[k]=true;prevKeys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;prevKeys[k]=false;});
canvas.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
canvas.addEventListener('mousedown',e=>{if(e.button===0)clicking=true;});
canvas.addEventListener('mouseup',e=>{if(e.button===0)clicking=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function tryDash(){
  if(!gameRunning||!me.hasDash||dashCDms>0||me.dead||choosingSkill)return;
  const ang=me.aimAngle||0;
  me.x=Math.max(20,Math.min(MAP_W-20,me.x+Math.cos(ang)*DASH_DIST));
  me.y=Math.max(20,Math.min(MAP_H-20,me.y+Math.sin(ang)*DASH_DIST));
  dashCDms=DASH_CD_MS;
  spawnP(me.x,me.y,me.color,10);
}

// ── 내 캐릭터 업데이트 (델타타임 기반) ──
function updateMe(dt){
  if(!gameRunning||me.dead||gameOver)return;

  // 재생 (ms 기반)
  if(me.hasRegen){
    me.regenTimer=(me.regenTimer||0)+dt*1000;
    if(me.regenTimer>=REGEN_INTERVAL_MS){me.regenTimer=0;me.hp=Math.min(me.maxHp,me.hp+2);}
  }

  // 쿨다운 (ms 기반)
  if(dashCDms>0)dashCDms=Math.max(0,dashCDms-dt*1000);
  if(swingCDms>0)swingCDms=Math.max(0,swingCDms-dt*1000);

  // 이동 (px/초 * dt초)
  if(!choosingSkill){
    me.prevX=me.x;me.prevY=me.y;
    let dx=0,dy=0;
    if(keys['w']||keys['arrowup'])dy-=1;
    if(keys['s']||keys['arrowdown'])dy+=1;
    if(keys['a']||keys['arrowleft'])dx-=1;
    if(keys['d']||keys['arrowright'])dx+=1;
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    me.x=Math.max(20,Math.min(MAP_W-20,me.x+dx*me.speed*dt));
    me.y=Math.max(20,Math.min(MAP_H-20,me.y+dy*me.speed*dt));
  }

  me.aimAngle=Math.atan2(my+cam.y-me.y,mx+cam.x-me.x)||0;

  // 스윙 시작
  if(!choosingSkill&&clicking&&!me.swinging&&swingCDms<=0){
    me.swinging=true;me.swingElapsed=0;
    me.swingStart=me.aimAngle-SWING_ARC/2;
    me.hitThisSwing=false;
    swingCDms=SWING_DUR_MS+100; // 스윙 시간 + 100ms 쿨
    // 검기 발사
    if(me.hasBlade){
      const spd=480; // px/초
      const vx=Math.cos(me.aimAngle)*spd,vy=Math.sin(me.aimAngle)*spd;
      const pid=Date.now()%1000000;
      projectiles.push({x:me.x,y:me.y,vx,vy,color:me.color,life:1.2,maxLife:1.2,fromOp:false,id:pid});
      send('proj',{x:Math.round(me.x),y:Math.round(me.y),vx:+vx.toFixed(1),vy:+vy.toFixed(1),id:pid});
    }
  }
  // 스윙 진행 (ms 기반)
  if(me.swinging){
    me.swingElapsed=(me.swingElapsed||0)+dt*1000;
    const t=Math.min(1,me.swingElapsed/SWING_DUR_MS);
    me.swordAngle=me.swingStart+t*SWING_ARC;
    if(me.swingElapsed>=SWING_DUR_MS){me.swinging=false;me.hitThisSwing=false;}
  }else{
    me.swordAngle=me.aimAngle;
  }

  // 구슬 먹기
  for(let i=0;i<orbs.length;i++){
    const o=orbs[i];if(!o.alive)continue;
    if(Math.hypot(me.x-o.x,me.y-o.y)<20+o.r){
      o.alive=false;
      me.totalXp+=o.value;
      me.swordLen=Math.min(MAX_SWORD,SWORD_BASE+Math.floor(me.totalXp/XP_PER_SWORD)*SWORD_GROW);
      if(me.nextSkillIdx<SKILL_THRESHOLDS.length&&me.totalXp>=SKILL_THRESHOLDS[me.nextSkillIdx]){
        showSkillChoice();
      }
      const nid=Date.now()%100000+Math.floor(Math.random()*1000);
      const no={x:Math.round(150+Math.random()*(MAP_W-300)),y:Math.round(150+Math.random()*(MAP_H-300)),v:8+Math.floor(Math.random()*18),id:nid};
      orbs.push({x:no.x,y:no.y,r:8,value:no.v,alive:true,pulse:Math.random()*Math.PI*2,id:nid});
      send('orb',{id:o.id,no});
      break;
    }
  }

  // 죽은 구슬 정리 (150프레임마다)
  if(frameCount%150===0)orbs=orbs.filter(o=>o.alive);

  // 검 타격 판정 (검 전체 5점 체크)
  // ※ 공격자는 endGame 호출 안 함 — 피격자가 자신의 죽음을 결정
  if(me.swinging&&!me.hitThisSwing&&!op.dead&&op.x){
    const ang=me.swordAngle,sl=me.swordLen;
    for(let k=0;k<=5;k++){
      const r=k/5;
      if(Math.hypot(me.x+Math.cos(ang)*(16+sl*r)-op.x, me.y+Math.sin(ang)*(16+sl*r)-op.y)<28){
        me.hitThisSwing=true;
        spawnP(op.rx||op.x,op.ry||op.y,'#e94560',12);
        send('hit',{d:BASE_DMG}); // 피격자가 HP 계산 후 dead 여부 결정
        break;
      }
    }
  }

  // 검기 이동 및 충돌 (dt 기반)
  for(let i=projectiles.length-1;i>=0;i--){
    const proj=projectiles[i];
    if(proj.fromOp)continue;
    proj.x+=proj.vx*dt;proj.y+=proj.vy*dt;proj.life-=dt;
    if(proj.life<=0){projectiles.splice(i,1);continue;}
    if(op.x&&Math.hypot(proj.x-op.x,proj.y-op.y)<22){
      spawnP(op.rx||op.x,op.ry||op.y,'#f0c040',8);
      send('blade_hit',{d:12}); // 피격자가 HP 계산
      projectiles.splice(i,1);
    }
  }

  // 위치 전송 (30fps) — 내 실제 HP도 포함
  const now=Date.now();
  if(now-lastPosSent>=33){
    lastPosSent=now;
    send('pos',{x:Math.round(me.x),y:Math.round(me.y),sa:+me.swordAngle.toFixed(3),sw:me.swinging,ss:+me.swingStart.toFixed(3),sl:Math.round(me.swordLen),xp:me.totalXp,hp:Math.round(me.hp)});
  }
}
// ── 상대 업데이트 (보간 버퍼) ──
function updateOp(dt){
  orbs.forEach(o=>{if(o.alive)o.pulse+=dt*4;});

  // 상대 검기 (dt 기반)
  for(let i=projectiles.length-1;i>=0;i--){
    const proj=projectiles[i];
    if(!proj.fromOp)continue;
    proj.x+=proj.vx*dt;proj.y+=proj.vy*dt;proj.life-=dt;
    if(proj.life<=0)projectiles.splice(i,1);
  }

  if(opBuf.length<2){
    if(opBuf.length===1){op.rx=opBuf[0].x;op.ry=opBuf[0].y;}
    return;
  }
  const renderTime=Date.now()-100;
  let prev=null,next=null;
  for(let i=0;i<opBuf.length-1;i++){
    if(opBuf[i].ts<=renderTime&&opBuf[i+1].ts>=renderTime){prev=opBuf[i];next=opBuf[i+1];break;}
  }
  if(!prev){
    const last=opBuf[opBuf.length-1];
    op.rx=last.x;op.ry=last.y;
    op.swordAngle=last.sa||0;
    if(last.sw&&!op.swinging){op.swinging=true;op.swingElapsed=0;op.swingStart=last.ss||0;}
    return;
  }
  const t=prev.ts===next.ts?1:(renderTime-prev.ts)/(next.ts-prev.ts);
  op.rx=prev.x+(next.x-prev.x)*t;
  op.ry=prev.y+(next.y-prev.y)*t;
  op.swordAngle=(prev.sa||0)+((next.sa||0)-(prev.sa||0))*t;
  if(next.sw&&!op.swinging){op.swinging=true;op.swingElapsed=0;op.swingStart=next.ss||0;}
  // 상대 스윙 애니메이션 (dt 기반)
  if(op.swinging){
    op.swingElapsed=(op.swingElapsed||0)+dt*1000;
    const st2=Math.min(1,op.swingElapsed/SWING_DUR_MS);
    op.swordAngle=op.swingStart+st2*SWING_ARC;
    if(op.swingElapsed>=SWING_DUR_MS){op.swinging=false;op.swingElapsed=0;}
  }
}

// ── 렌더링 ──
function spawnP(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,maxLife:40,col});
  }
}
const tileImg=document.createElement('canvas');tileImg.width=tileImg.height=TILE;
(()=>{const t=tileImg.getContext('2d');t.fillStyle='#0f0f1e';t.fillRect(0,0,TILE,TILE);t.strokeStyle='#141428';t.lineWidth=1;t.strokeRect(0,0,TILE,TILE);})();
let tilePat=null;

function drawMap(){
  const W=canvas.width,H=canvas.height;
  if(!tilePat)tilePat=ctx.createPattern(tileImg,'repeat');
  ctx.save();ctx.translate(-cam.x%TILE,-cam.y%TILE);
  ctx.fillStyle=tilePat;ctx.fillRect(-TILE,-TILE,W+TILE*2,H+TILE*2);ctx.restore();
  ctx.save();ctx.shadowColor='#e94560';ctx.shadowBlur=20;
  ctx.strokeStyle='#e9456066';ctx.lineWidth=3;
  ctx.strokeRect(-cam.x,-cam.y,MAP_W,MAP_H);ctx.restore();
}

function drawOrbs(){
  const W=canvas.width,H=canvas.height;
  for(const o of orbs){
    if(!o.alive)continue;
    const sx=o.x-cam.x,sy=o.y-cam.y;
    if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;
    const s=1+.15*Math.sin(o.pulse);
    ctx.save();ctx.shadowColor='#f0c040';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(sx,sy,o.r*s,0,Math.PI*2);
    ctx.fillStyle='#f0c040';ctx.fill();ctx.restore();
    ctx.fillStyle='#1a1a00';ctx.font='bold 8px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('+'+o.value,sx,sy);
  }
}

function drawProjectiles(){
  for(const p of projectiles){
    const sx=p.x-cam.x,sy=p.y-cam.y;
    const W=canvas.width,H=canvas.height;
    if(sx<-30||sx>W+30||sy<-30||sy>H+30)continue;
    // life는 초 단위(0~1.2), alpha는 0~1
    const a=Math.min(1,p.life/p.maxLife);
    const spd=Math.hypot(p.vx,p.vy)||1;
    const nx=p.vx/spd,ny=p.vy/spd; // 정규화된 방향
    ctx.save();ctx.globalAlpha=Math.max(0.2,a);
    ctx.shadowColor=p.color;ctx.shadowBlur=18;
    // 검기 본체
    ctx.beginPath();ctx.arc(sx,sy,6,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.fill();
    // 꼬리 (정규화 방향으로 16px)
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-nx*16,sy-ny*16);
    ctx.strokeStyle=p.color;ctx.lineWidth=3;ctx.stroke();
    ctx.restore();
  }
}

function drawPlayer(p,isMe){
  if(!p||!p.x)return;
  // 상대는 보간된 렌더링 위치 사용, 나는 실제 위치 사용
  const drawX = isMe ? p.x : (p.rx||p.x);
  const drawY = isMe ? p.y : (p.ry||p.y);
  const sx=drawX-cam.x,sy=drawY-cam.y;
  const W=canvas.width,H=canvas.height;
  if(sx<-200||sx>W+200||sy<-200||sy>H+200)return;
  ctx.globalAlpha=p.dead?.3:1;
  // 재생 글로우
  if(p.hasRegen&&!p.dead){
    ctx.save();ctx.shadowColor='#4ecca3';ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(sx,sy,18,0,Math.PI*2);
    ctx.strokeStyle='#4ecca355';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  }
  // 몸통
  ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=16;
  ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fillStyle=p.color+'bb';ctx.fill();
  ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();

  if(!p.dead){
    // 검
    const ang=isFinite(p.swordAngle)?p.swordAngle:0;
    const sl=Math.max(SWORD_BASE,Math.min(MAX_SWORD,p.swordLen||SWORD_BASE));
    const hx=sx+Math.cos(ang)*16,hy=sy+Math.sin(ang)*16;
    const tx=sx+Math.cos(ang)*(16+sl),ty=sy+Math.sin(ang)*(16+sl);
    ctx.save();ctx.shadowColor=p.swinging?'#fff':p.color;ctx.shadowBlur=p.swinging?18:6;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);
    ctx.strokeStyle=p.swinging?'#fff':p.color;ctx.lineWidth=p.swinging?4:2.5;ctx.stroke();
    if(p.swinging){ctx.beginPath();ctx.arc(tx,ty,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
    ctx.restore();
    // HP바
    const bw=44;
    ctx.fillStyle='#0009';ctx.fillRect(sx-bw/2-1,sy-30,bw+2,6);
    ctx.fillStyle=p.hp>60?p.color:p.hp>30?'#f0c040':'#e94560';
    ctx.fillRect(sx-bw/2,sy-29,bw*(Math.max(0,p.hp)/p.maxHp),4);
    // 이름
    ctx.fillStyle=isMe?'#4ecca3':'#e94560';
    ctx.font='10px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(isMe?'나':'상대',sx,sy-32);
    // 대쉬 쿨다운 표시
    if(isMe&&p.hasDash&&dashCDms>0){
      ctx.fillStyle='#e9456088';ctx.font='9px monospace';
      ctx.fillText('E:'+(dashCDms/1000).toFixed(1)+'s',sx,sy-42);
    }
  }
  ctx.globalAlpha=1;
}

function drawParticles(){
  particles=particles.filter(p=>p.life>0);
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife*.9;
    ctx.beginPath();ctx.arc(p.x-cam.x,p.y-cam.y,2.5,0,Math.PI*2);
    ctx.fillStyle=p.col;ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life--;
  }
  ctx.globalAlpha=1;
}

function drawMinimap(){
  const sw=150/MAP_W,sh=150/MAP_H;
  mctx.clearRect(0,0,150,150);
  mctx.fillStyle='rgba(5,8,20,.88)';mctx.fillRect(0,0,150,150);
  mctx.strokeStyle='#1a3060';mctx.lineWidth=1;mctx.strokeRect(0,0,150,150);
  for(const o of orbs){
    if(!o.alive)continue;
    mctx.beginPath();mctx.arc(o.x*sw,o.y*sh,2,0,Math.PI*2);
    mctx.fillStyle='#f0c04066';mctx.fill();
  }
  if(me.x){mctx.beginPath();mctx.arc(me.x*sw,me.y*sh,4,0,Math.PI*2);mctx.fillStyle=me.color||'#4ecca3';mctx.fill();}
  if(op.x){mctx.beginPath();mctx.arc(op.x*sw,op.y*sh,4,0,Math.PI*2);mctx.fillStyle=op.color||'#e94560';mctx.fill();}
  mctx.strokeStyle='#fff2';mctx.lineWidth=1;
  mctx.strokeRect(cam.x*sw,cam.y*sh,canvas.width*sw,canvas.height*sh);
}

function updateHUD(){
  const mxp=me.totalXp||0,oxp=op.totalXp||0;
  const nextThresh=SKILL_THRESHOLDS[me.nextSkillIdx]||SKILL_THRESHOLDS[SKILL_THRESHOLDS.length-1];
  const prevThresh=me.nextSkillIdx>0?SKILL_THRESHOLDS[me.nextSkillIdx-1]:0;
  const prog=Math.min(100,((mxp-prevThresh)/(nextThresh-prevThresh))*100)||0;
  document.getElementById('h1hp').textContent=Math.max(0,Math.round(me.hp||0));
  document.getElementById('h1hpf').style.width=((me.hp||0)/100*100)+'%';
  document.getElementById('h1xp').textContent=mxp;
  document.getElementById('h1xpf').style.width=prog+'%';
  document.getElementById('h1sw').textContent=Math.round(me.swordLen||SWORD_BASE);
  document.getElementById('h2hp').textContent=Math.max(0,Math.round(op.hp||0));
  document.getElementById('h2hpf').style.width=((op.hp||0)/100*100)+'%';
  document.getElementById('h2xp').textContent=oxp;
  document.getElementById('h2xpf').style.width=Math.min(100,(oxp/nextThresh*100))+'%';
  document.getElementById('h2sw').textContent=Math.round(op.swordLen||SWORD_BASE);
}

// ── 메인 루프 ──
function loop(timestamp){
  requestAnimationFrame(loop);
  if(!gameRunning)return;
  // 델타타임 계산 (초 단위, 최대 100ms 캡)
  const dt=Math.min((timestamp-(lastFrameTime||timestamp))/1000, 0.1);
  lastFrameTime=timestamp;
  frameCount++;
  updateMe(dt);updateOp(dt);
  if(me.x){
    cam.x=Math.max(0,Math.min(MAP_W-canvas.width,me.x-canvas.width/2));
    cam.y=Math.max(0,Math.min(MAP_H-canvas.height,me.y-canvas.height/2));
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMap();drawOrbs();drawProjectiles();
  drawPlayer(me,true);drawPlayer(op,false);
  drawParticles();drawMinimap();updateHUD();
}

function startGame(){
  document.getElementById('ui').style.display='none';
  document.getElementById('gameContainer').style.display='block';
  document.getElementById('overlay').style.display='none';
  gameRunning=true;gameOver=false;
}
function endGame(win){
  if(gameOver)return;
  gameOver=true;gameRunning=false;
  document.getElementById('skillOverlay').style.display='none';
  document.getElementById('ovT').textContent=win?'🏆 승리!':'💀 패배...';
  document.getElementById('ovT').style.color=win?'#4ecca3':'#e94560';
  document.getElementById('ovM').textContent=win?'상대를 처치했습니다!':'쓰러졌습니다...';
  document.getElementById('overlay').style.display='flex';
}
function backToLobby(){
  gameRunning=false;gameOver=false;choosingSkill=false;
  if(ch){sb.removeChannel(ch);ch=null;}
  me={};op={};orbs=[];particles=[];opBuf=[];projectiles=[];
  swingCDms=0;dashCDms=0;frameCount=0;lastFrameTime=0;myRole=null;
  document.getElementById('overlay').style.display='none';
  document.getElementById('skillOverlay').style.display='none';
  document.getElementById('gameContainer').style.display='none';
  document.getElementById('ui').style.display='flex';
  document.getElementById('codeBox').style.display='none';
  document.getElementById('codeIn').value='';
  document.getElementById('h1skills').innerHTML='';
  document.getElementById('h2skills').innerHTML='';
  setBtns(false);st('');
}
loop();
</script>
