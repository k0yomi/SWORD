<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ SWORD DUEL ONLINE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0d0d1a;color:#eee;font-family:'Share Tech Mono',monospace;overflow:hidden;user-select:none;}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#0d0d1a;}
#lobby{text-align:center;background:rgba(15,20,50,0.97);border:1px solid #1a3060;border-radius:16px;padding:2.5rem 2rem;width:380px;box-shadow:0 0 60px rgba(78,204,163,0.08);}
h1{font-family:'Orbitron',sans-serif;font-size:2rem;font-weight:900;color:#4ecca3;letter-spacing:4px;margin-bottom:.2rem;text-shadow:0 0 20px rgba(78,204,163,.5);}
.sub{color:#445;font-size:.75rem;letter-spacing:3px;margin-bottom:1.8rem;}
.sep{border:none;border-top:1px solid #1a3060;margin:1.1rem 0;}
.btn{background:transparent;border:1px solid currentColor;padding:11px 0;border-radius:8px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:.95rem;width:100%;transition:all .18s;display:block;margin:6px 0;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-g{color:#4ecca3;}.btn-g:hover:not(:disabled){background:#4ecca3;color:#0d0d1a;}
.btn-r{color:#e94560;}.btn-r:hover:not(:disabled){background:#e94560;color:#fff;}
input{background:rgba(15,50,80,.6);border:1px solid #4ecca3;color:#fff;padding:11px 14px;border-radius:8px;font-family:'Share Tech Mono',monospace;font-size:1.1rem;width:100%;margin:6px 0;outline:none;text-transform:uppercase;letter-spacing:6px;text-align:center;}
input::placeholder{color:#334;letter-spacing:1px;text-transform:none;font-size:.82rem;}
#status{font-size:.8rem;margin-top:10px;min-height:36px;line-height:1.7;}
.code-box{font-family:'Orbitron',sans-serif;font-size:2.2rem;color:#4ecca3;letter-spacing:10px;background:rgba(78,204,163,.07);border:1px dashed #4ecca355;border-radius:10px;padding:14px;margin:10px 0;display:none;cursor:pointer;}
.code-box:hover{background:rgba(78,204,163,.15);}
.code-hint{color:#445;font-size:.7rem;margin-top:2px;}
.badge{display:inline-block;background:#4ecca322;border:1px solid #4ecca344;color:#4ecca3;font-size:.65rem;padding:2px 10px;border-radius:20px;letter-spacing:2px;margin-bottom:1rem;}
#gameContainer{display:none;position:fixed;inset:0;}
canvas{display:block;}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;}
.phud{background:rgba(5,8,20,.88);border:1px solid;border-radius:10px;padding:10px 14px;min-width:175px;backdrop-filter:blur(6px);}
.pm{border-color:#4ecca355;}.po{border-color:#e9456055;}
.hud-name{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;margin-bottom:6px;}
.hud-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:.72rem;color:#667;}
.hud-bar{flex:1;height:5px;background:#111;border-radius:3px;overflow:hidden;}
.hud-fill{height:100%;border-radius:3px;transition:width .2s;}
#ch{font-size:.72rem;color:#445;text-align:center;padding-top:4px;}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:200;}
#ovBox{text-align:center;background:rgba(10,15,40,.99);border:1px solid #1a3060;border-radius:16px;padding:2.5rem 2rem;width:300px;}
#ovBox h2{font-family:'Orbitron',sans-serif;font-size:1.8rem;margin-bottom:.5rem;}
#ovBox p{color:#667;margin-bottom:1.5rem;}
#minimap{position:fixed;bottom:14px;right:14px;opacity:.75;border-radius:4px;}
#ctrl{position:fixed;bottom:14px;left:14px;font-size:.65rem;color:#334;line-height:1.9;pointer-events:none;}
</style>
</head>
<body>
<div id="ui">
  <div id="lobby">
    <div class="badge">🌐 P2P ONLINE</div>
    <h1>⚔ SWORD DUEL</h1>
    <div class="sub">경험치 · 검 성장 · 1 VS 1</div>
    <hr class="sep">
    <button class="btn btn-g" id="hBtn" onclick="hostRoom()">🏠 방 만들기</button>
    <div class="code-box" id="codeBox" onclick="copyCode()"></div>
    <div class="code-hint" id="codeHint"></div>
    <hr class="sep">
    <input id="codeIn" maxlength="6" placeholder="방 코드 6자리 입력" oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')">
    <button class="btn btn-r" id="jBtn" onclick="joinRoom()">🚪 참가하기</button>
    <div id="status"></div>
  </div>
</div>
<div id="gameContainer">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="phud pm">
      <div class="hud-name" style="color:#4ecca3">나 ▶</div>
      <div class="hud-row">HP <span id="h1hp">100</span><div class="hud-bar"><div class="hud-fill" id="h1hpf" style="width:100%;background:#4ecca3"></div></div></div>
      <div class="hud-row">XP <span id="h1xp">0</span>/<span id="h1xpn">100</span><div class="hud-bar"><div class="hud-fill" id="h1xpf" style="width:0%;background:#f0c040"></div></div></div>
      <div class="hud-row" style="color:#4ecca3aa">검 <span id="h1sw">60</span>px</div>
    </div>
    <div id="ch">🌐 연결됨</div>
    <div class="phud po" style="text-align:right">
      <div class="hud-name" style="color:#e94560">◀ 상대</div>
      <div class="hud-row">HP <span id="h2hp">100</span><div class="hud-bar"><div class="hud-fill" id="h2hpf" style="width:100%;background:#e94560"></div></div></div>
      <div class="hud-row">XP <span id="h2xp">0</span>/<span id="h2xpn">100</span><div class="hud-bar"><div class="hud-fill" id="h2xpf" style="width:0%;background:#f0c040"></div></div></div>
      <div class="hud-row" style="color:#e9456088;justify-content:flex-end">검 <span id="h2sw">60</span>px</div>
    </div>
  </div>
  <canvas id="minimap" width="150" height="150"></canvas>
  <div id="ctrl">WASD / 방향키 이동 | 마우스 조준 | 좌클릭 휘두르기</div>
  <div id="overlay">
    <div id="ovBox">
      <h2 id="ovT"></h2><p id="ovM"></p>
      <button class="btn btn-g" onclick="backToLobby()">로비로 돌아가기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ── Supabase ──
const SUPA_URL = 'https://dbhyycsjnqwowdwzhqgk.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiaHl5Y3NqbnF3b3dkd3pocWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MTM0ODgsImV4cCI6MjA5NjM4OTQ4OH0.oqeI0DlceqW9bsSL7u1RMQ8jZyYlEZQoSOTS6QGYFeU';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let channel = null;
let myRole = null, roomCode = '', gameRunning = false;

// ── Game constants ──
const MAP_W=2400,MAP_H=2400,TILE=80;
const SPEED=3.8,SWING_DUR=20,SWING_ARC=Math.PI*1.15,DMG=22;

let gs=null,particles=[],cam={x:0,y:0};
let swingCD=0,lastInputStr='',clicking=false;
const keys={};
let mx=0,my=0;

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const mm=document.getElementById('minimap'),mctx=mm.getContext('2d');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// ── UI helpers ──
function st(msg,c='#4ecca3'){const e=document.getElementById('status');e.style.color=c;e.innerHTML=msg;}
function setBtns(d){document.getElementById('hBtn').disabled=d;document.getElementById('jBtn').disabled=d;}
function copyCode(){
  navigator.clipboard.writeText(roomCode).catch(()=>{});
  document.getElementById('codeHint').textContent='✅ 복사됨!';
  setTimeout(()=>document.getElementById('codeHint').textContent='클릭하면 복사',1500);
}

// ── Network ──
function send(type, payload={}){
  if(!channel) return;
  channel.send({type:'broadcast', event:'msg', payload:{type, payload, from:myRole}});
}

function setupChannel(code, onReady){
  if(channel){supa.removeChannel(channel); channel=null;}
  channel = supa.channel('swordduel_'+code, {
    config:{ broadcast:{ self:false } }
  });
  channel.on('broadcast',{event:'msg'},({payload})=>handleMsg(payload));
  channel.subscribe(status=>{
    if(status==='SUBSCRIBED') onReady && onReady();
    else if(status==='CHANNEL_ERROR'){
      st('❌ 서버 연결 실패. 새로고침 해주세요.','#e94560');
      setBtns(false);
    }
  });
}

// ── Host ──
function hostRoom(){
  setBtns(true);
  st('서버 연결 중...');
  roomCode = randCode();
  myRole = 'host';
  setupChannel(roomCode, ()=>{
    const box=document.getElementById('codeBox');
    box.style.display='block'; box.textContent=roomCode;
    document.getElementById('codeHint').textContent='클릭하면 복사';
    st('✅ 준비됨! 친구에게 <b>'+roomCode+'</b> 코드를 보내주세요.');
  });
}

// ── Guest ──
function joinRoom(){
  const code=document.getElementById('codeIn').value.trim().toUpperCase();
  if(code.length<4){st('방 코드를 입력하세요','#e94560');return;}
  roomCode=code; myRole='guest';
  setBtns(true);
  st('서버 연결 중...');
  setupChannel(code, ()=>{
    st('✅ 연결됨! 참가 신호 전송 중...');
    send('join');
  });
  setTimeout(()=>{if(!gameRunning){st('⚠️ 응답 없음.<br>호스트가 먼저 방을 만들어야 합니다.','#e94560');setBtns(false);}},12000);
}

// ── Game state ──
function mkP(x,y,color){
  return{x,y,hp:100,maxHp:100,xp:0,xpNext:100,swordLen:60,swordAngle:0,
    swinging:false,swingT:0,swingStart:0,dead:false,color,hitThisSwing:false};
}
function mkOrbs(n=35){
  const o=[];
  for(let i=0;i<n;i++) o.push({
    x:120+Math.random()*(MAP_W-240),y:120+Math.random()*(MAP_H-240),
    r:7,value:10+Math.floor(Math.random()*25),alive:true,pulse:Math.random()*Math.PI*2
  });
  return o;
}
function initGS(){
  gs={
    host:mkP(200,200,'#4ecca3'),
    guest:mkP(MAP_W-200,MAP_H-200,'#e94560'),
    orbs:mkOrbs(35),tick:0,over:false,winner:null
  };
}

// ── Input ──
window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
canvas.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
canvas.addEventListener('mousedown',e=>{if(e.button===0)clicking=true;});
canvas.addEventListener('mouseup',e=>{if(e.button===0)clicking=false;});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

function processInput(){
  if(!gs||gs.over)return;
  const me=myRole==='host'?gs.host:gs.guest;
  if(me.dead)return;
  let dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['arrowright'])dx+=1;
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  me.x=Math.max(20,Math.min(MAP_W-20,me.x+dx*SPEED));
  me.y=Math.max(20,Math.min(MAP_H-20,me.y+dy*SPEED));
  me.aimAngle=Math.atan2(my+cam.y-me.y,mx+cam.x-me.x);
  if(clicking&&!me.swinging&&swingCD<=0){
    me.swinging=true;me.swingT=0;
    me.swingStart=me.aimAngle-SWING_ARC/2;
    me.hitThisSwing=false;swingCD=30;
  }
  if(swingCD>0)swingCD--;
  const s=`${Math.round(me.x)},${Math.round(me.y)},${me.aimAngle?.toFixed(3)},${me.swinging},${me.swingStart?.toFixed(3)}`;
  if(s!==lastInputStr){
    send('input',{x:me.x,y:me.y,aimAngle:me.aimAngle,swinging:me.swinging,swingStart:me.swingStart});
    lastInputStr=s;
  }
}

function applyInput(role,d){
  if(!gs)return;
  const p=gs[role];
  p.x=d.x;p.y=d.y;p.aimAngle=d.aimAngle;
  if(d.swinging&&!p.swinging){p.swinging=true;p.swingT=0;p.swingStart=d.swingStart;p.hitThisSwing=false;}
}

// ── Simulation ──
function simulate(){
  if(!gs||gs.over)return;
  ['host','guest'].forEach(r=>{
    const p=gs[r];if(p.dead)return;
    if(p.swinging){
      p.swingT++;
      p.swordAngle=p.swingStart+(p.swingT/SWING_DUR)*SWING_ARC;
      if(p.swingT>=SWING_DUR){p.swinging=false;p.hitThisSwing=false;}
    }else p.swordAngle=p.aimAngle||0;
  });
  chkHit('host','guest');chkHit('guest','host');
  ['host','guest'].forEach(r=>{
    const p=gs[r];if(p.dead)return;
    gs.orbs.forEach(o=>{
      if(!o.alive)return;
      const dx=p.x-o.x,dy=p.y-o.y;
      if(Math.sqrt(dx*dx+dy*dy)<18+o.r){
        o.alive=false;p.xp+=o.value;
        while(p.xp>=p.xpNext){p.xp-=p.xpNext;p.xpNext=Math.floor(p.xpNext*1.5);p.swordLen+=24;}
      }
    });
  });
  if(gs.orbs.filter(o=>o.alive).length<10)
    for(let i=0;i<8;i++) gs.orbs.push({x:120+Math.random()*(MAP_W-240),y:120+Math.random()*(MAP_H-240),r:7,value:10+Math.floor(Math.random()*25),alive:true,pulse:Math.random()*Math.PI*2});
  if(gs.host.dead||gs.guest.dead){gs.over=true;gs.winner=gs.host.dead?'guest':'host';}
  gs.tick++;
  gs.orbs.forEach(o=>{if(o.alive)o.pulse+=0.07;});
}

function chkHit(ar,dr){
  const a=gs[ar],d=gs[dr];
  if(!a.swinging||d.dead||a.hitThisSwing)return;
  const tx=a.x+Math.cos(a.swordAngle)*a.swordLen;
  const ty=a.y+Math.sin(a.swordAngle)*a.swordLen;
  if(Math.hypot(tx-d.x,ty-d.y)<24){
    d.hp=Math.max(0,d.hp-DMG);a.hitThisSwing=true;
    spawnP(d.x,d.y,'#e94560',12);
    if(d.hp<=0)d.dead=true;
  }
}

// ── Render ──
function spawnP(x,y,col,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,maxLife:40,col});
  }
}

const tileImg=document.createElement('canvas');tileImg.width=tileImg.height=TILE;
(()=>{const t=tileImg.getContext('2d');t.fillStyle='#0f0f1e';t.fillRect(0,0,TILE,TILE);t.strokeStyle='#141428';t.lineWidth=1;t.strokeRect(0,0,TILE,TILE);})();
let tilePat=null;

function drawMap(){
  const W=canvas.width,H=canvas.height;
  if(!tilePat)tilePat=ctx.createPattern(tileImg,'repeat');
  ctx.save();ctx.translate(-cam.x%TILE,-cam.y%TILE);
  ctx.fillStyle=tilePat;ctx.fillRect(-TILE,-TILE,W+TILE*2,H+TILE*2);ctx.restore();
  ctx.save();ctx.shadowColor='#e94560';ctx.shadowBlur=20;
  ctx.strokeStyle='#e9456066';ctx.lineWidth=3;
  ctx.strokeRect(-cam.x,-cam.y,MAP_W,MAP_H);ctx.restore();
}

function drawOrbs(){
  const W=canvas.width,H=canvas.height;
  gs.orbs.forEach(o=>{
    if(!o.alive)return;
    const sx=o.x-cam.x,sy=o.y-cam.y;
    if(sx<-30||sx>W+30||sy<-30||sy>H+30)return;
    const s=1+.15*Math.sin(o.pulse);
    ctx.save();ctx.shadowColor='#f0c040';ctx.shadowBlur=12;
    ctx.beginPath();ctx.arc(sx,sy,o.r*s,0,Math.PI*2);
    ctx.fillStyle='#f0c040';ctx.fill();ctx.restore();
    ctx.fillStyle='#1a1a00';ctx.font='bold 8px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('+'+o.value,sx,sy);
  });
}

function drawPlayer(p,isMe){
  const sx=p.x-cam.x,sy=p.y-cam.y;
  const W=canvas.width,H=canvas.height;
  if(sx<-100||sx>W+100||sy<-100||sy>H+100)return;
  ctx.globalAlpha=p.dead?.25:1;
  ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=20;
  ctx.beginPath();ctx.arc(sx,sy,16,0,Math.PI*2);ctx.fillStyle=p.color+'33';ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fillStyle=p.color+'bb';ctx.fill();
  ctx.strokeStyle=p.color;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  if(!p.dead){
    const ang=p.swordAngle||0;
    const hx=sx+Math.cos(ang)*16,hy=sy+Math.sin(ang)*16;
    const tx=sx+Math.cos(ang)*(16+p.swordLen),ty=sy+Math.sin(ang)*(16+p.swordLen);
    ctx.save();ctx.shadowColor=p.swinging?'#fff':p.color;ctx.shadowBlur=p.swinging?20:8;
    const g=ctx.createLinearGradient(hx,hy,tx,ty);
    g.addColorStop(0,p.color);g.addColorStop(1,p.swinging?'#fff':'#fff8');
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);
    ctx.strokeStyle=g;ctx.lineWidth=p.swinging?4:2.5;ctx.stroke();
    if(p.swinging){ctx.beginPath();ctx.arc(tx,ty,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();}
    ctx.restore();
    const bw=44;
    ctx.fillStyle='#111a';ctx.fillRect(sx-bw/2-1,sy-30,bw+2,7);
    ctx.fillStyle=p.hp>60?p.color:p.hp>30?'#f0c040':'#e94560';
    ctx.fillRect(sx-bw/2,sy-29,bw*(p.hp/p.maxHp),5);
    ctx.fillStyle=isMe?'#4ecca3':'#e94560';
    ctx.font='11px monospace';ctx.textAlign='center';ctx.textBaseline='bottom';
    ctx.fillText(isMe?'나':'상대',sx,sy-32);
  }
  ctx.globalAlpha=1;
}

function drawParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/p.maxLife*.9;
    ctx.beginPath();ctx.arc(p.x-cam.x,p.y-cam.y,2.5,0,Math.PI*2);
    ctx.fillStyle=p.col;ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;p.life--;
  });
  ctx.globalAlpha=1;
}

function drawMinimap(){
  const sw=150/MAP_W,sh=150/MAP_H;
  mctx.clearRect(0,0,150,150);
  mctx.fillStyle='rgba(5,8,20,.88)';mctx.fillRect(0,0,150,150);
  mctx.strokeStyle='#1a3060';mctx.lineWidth=1;mctx.strokeRect(0,0,150,150);
  gs.orbs.forEach(o=>{
    if(!o.alive)return;
    mctx.beginPath();mctx.arc(o.x*sw,o.y*sh,2,0,Math.PI*2);
    mctx.fillStyle='#f0c04066';mctx.fill();
  });
  [{p:gs.host,c:'#4ecca3'},{p:gs.guest,c:'#e94560'}].forEach(({p,c})=>{
    mctx.beginPath();mctx.arc(p.x*sw,p.y*sh,4,0,Math.PI*2);
    mctx.fillStyle=c;mctx.fill();
  });
  mctx.strokeStyle='#fff2';mctx.lineWidth=1;
  mctx.strokeRect(cam.x*sw,cam.y*sh,canvas.width*sw,canvas.height*sh);
}

function updateHUD(){
  if(!gs)return;
  const me=myRole==='host'?gs.host:gs.guest;
  const op=myRole==='host'?gs.guest:gs.host;
  document.getElementById('h1hp').textContent=Math.max(0,Math.round(me.hp));
  document.getElementById('h1hpf').style.width=(me.hp/me.maxHp*100)+'%';
  document.getElementById('h1xp').textContent=me.xp;
  document.getElementById('h1xpn').textContent=me.xpNext;
  document.getElementById('h1xpf').style.width=(me.xp/me.xpNext*100)+'%';
  document.getElementById('h1sw').textContent=Math.round(me.swordLen);
  document.getElementById('h2hp').textContent=Math.max(0,Math.round(op.hp));
  document.getElementById('h2hpf').style.width=(op.hp/op.maxHp*100)+'%';
  document.getElementById('h2xp').textContent=op.xp;
  document.getElementById('h2xpn').textContent=op.xpNext;
  document.getElementById('h2xpf').style.width=(op.xp/op.xpNext*100)+'%';
  document.getElementById('h2sw').textContent=Math.round(op.swordLen);
}

// ── Main loop ──
let stThrottle=0;
function loop(){
  requestAnimationFrame(loop);
  if(!gameRunning||!gs)return;
  processInput();
  if(myRole==='host'){
    simulate();
    if(++stThrottle>=2){
      stThrottle=0;
      send('state',{
        hx:Math.round(gs.host.x),hy:Math.round(gs.host.y),hhp:gs.host.hp,
        hxp:gs.host.xp,hxpn:gs.host.xpNext,hsl:Math.round(gs.host.swordLen),
        hsa:gs.host.swordAngle,hsw:gs.host.swinging,hss:gs.host.swingStart,
        gx:Math.round(gs.guest.x),gy:Math.round(gs.guest.y),ghp:gs.guest.hp,
        gxp:gs.guest.xp,gxpn:gs.guest.xpNext,gsl:Math.round(gs.guest.swordLen),
        gsa:gs.guest.swordAngle,gsw:gs.guest.swinging,gss:gs.guest.swingStart,
        orbs:gs.orbs.map(o=>o.alive?1:0),over:gs.over,winner:gs.winner
      });
    }
  }
  const me=myRole==='host'?gs.host:gs.guest;
  cam.x=Math.max(0,Math.min(MAP_W-canvas.width,me.x-canvas.width/2));
  cam.y=Math.max(0,Math.min(MAP_H-canvas.height,me.y-canvas.height/2));
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawMap();drawOrbs();
  drawPlayer(gs.host,myRole==='host');
  drawPlayer(gs.guest,myRole==='guest');
  drawParticles();drawMinimap();updateHUD();
  if(gs.over&&gameRunning){
    gameRunning=false;
    const win=gs.winner===myRole;
    document.getElementById('ovT').textContent=win?'🏆 승리!':'💀 패배...';
    document.getElementById('ovT').style.color=win?'#4ecca3':'#e94560';
    document.getElementById('ovM').textContent=win?'상대를 처치했습니다!':'쓰러졌습니다...';
    document.getElementById('overlay').style.display='flex';
  }
}

// ── Message handler ──
function handleMsg(msg){
  if(!msg||!msg.type)return;
  if(msg.type==='join'&&myRole==='host'){
    st('상대방 입장! 게임 시작!');
    initGS();
    send('start', gs);
    setTimeout(()=>startGame(),300);
  }
  if(msg.type==='start'&&myRole==='guest'){gs=msg.payload;startGame();}
  if(msg.type==='input'&&myRole==='host')applyInput(msg.from,msg.payload);
  if(msg.type==='state'&&myRole==='guest'){
    if(!gs)return;
    const d=msg.payload,ph=gs.host.hp,pg=gs.guest.hp;
    gs.host.x=d.hx;gs.host.y=d.hy;gs.host.hp=d.hhp;
    gs.host.xp=d.hxp;gs.host.xpNext=d.hxpn;gs.host.swordLen=d.hsl;
    gs.host.swordAngle=d.hsa;gs.host.swinging=d.hsw;gs.host.swingStart=d.hss;gs.host.dead=d.hhp<=0;
    gs.guest.x=d.gx;gs.guest.y=d.gy;gs.guest.hp=d.ghp;
    gs.guest.xp=d.gxp;gs.guest.xpNext=d.gxpn;gs.guest.swordLen=d.gsl;
    gs.guest.swordAngle=d.gsa;gs.guest.swinging=d.gsw;gs.guest.swingStart=d.gss;gs.guest.dead=d.ghp<=0;
    if(d.orbs)d.orbs.forEach((v,i)=>{if(gs.orbs[i])gs.orbs[i].alive=v===1;});
    gs.over=d.over;gs.winner=d.winner;
    if(gs.host.hp<ph-1)spawnP(gs.host.x,gs.host.y,'#e94560',8);
    if(gs.guest.hp<pg-1)spawnP(gs.guest.x,gs.guest.y,'#e94560',8);
  }
}

function startGame(){
  document.getElementById('ui').style.display='none';
  document.getElementById('gameContainer').style.display='block';
  document.getElementById('overlay').style.display='none';
  gameRunning=true;
}

function backToLobby(){
  gameRunning=false;gs=null;
  if(channel){supa.removeChannel(channel);channel=null;}
  myRole=null;
  particles=[];swingCD=0;lastInputStr='';
  document.getElementById('overlay').style.display='none';
  document.getElementById('gameContainer').style.display='none';
  document.getElementById('ui').style.display='flex';
  document.getElementById('codeBox').style.display='none';
  document.getElementById('codeIn').value='';
  setBtns(false);st('');
}

loop();
</script>
